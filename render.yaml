# Render Blueprint: creates the API and a PostgreSQL database.
services:
  - type: web
    name: kept-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase: { name: kept-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: KEPT_TODAY
        value: "2026-10-13"
databases:
  - name: kept-db
    plan: free
